[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "{{cookiecutter.repo_name}}"
dynamic = ["version"]
description = "{{cookiecutter.short_description}}"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
  { name = "{{cookiecutter.author_name}}", email = "{{cookiecutter.author_email}}" },
]
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["black", "flake8", "isort", "pytest", "pytest-django"]

[project.urls]
Homepage = "{{cookiecutter.repo_url}}"

# byro only uses the module part of the entry point value to add the app to
# INSTALLED_APPS; Django then discovers PluginApp from apps.py.
[project.entry-points."byro.plugin"]
{{cookiecutter.module_name}} = "{{cookiecutter.module_name}}"

[tool.setuptools.dynamic]
version = { attr = "{{cookiecutter.module_name}}.__version__" }

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
skip = ["migrations"]
known_first_party = ["byro", "{{cookiecutter.module_name}}"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "byro.common.settings.test_settings"
testpaths = ["tests"]
